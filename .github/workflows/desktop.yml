name: Desktop packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Which desktop package to build
        type: choice
        default: both
        options: [both, windows, macos]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  windows:
    name: Compile Windows installer
    if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'windows'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-win-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Compile macOS disk image
    if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'macos'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-mac-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error
          retention-days: 14
