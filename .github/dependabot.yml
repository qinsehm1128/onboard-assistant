version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    groups:
      frontend:
        patterns:
          - "react*"
          - "lucide-react"
          - "vite"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
      electron:
        patterns:
          - "electron"
          - "electron-builder"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
