appId: com.company.onboard-assistant
productName: AI电脑基础安装
directories:
  output: release
files:
  - dist/**
  - dist-server/**
  - electron/**
  - package.json
asarUnpack:
  - dist/**
mac:
  category: public.app-category.utilities
  target:
    - dmg
  artifactName: onboard-assistant-${version}-${arch}.${ext}
win:
  target:
    - nsis
  artifactName: onboard-assistant-setup-${version}.${ext}
nsis:
  artifactName: onboard-assistant-setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
forceCodeSigning: false
publish:
  provider: github
  owner: qinsehm1128
  repo: onboard-assistant
  releaseType: release
